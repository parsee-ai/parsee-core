[project]
name = "parsee-core"
version = "0.1.8.6"
description = ""
authors = [{ name = "Parsee.ai", email = "info@parsee.ai" }]
requires-python = ">=3.10,<3.11"
dependencies = [
    "requests>=2.28.1,<3",
    "pandas>=1.4.3,<2",
    "numpy>=1.23.1,<2",
    "tiktoken>=0.4.0,<1",
    "pydantic>=2.7.0,<3",
    "beautifulsoup4>=4.11.1,<5",
    "parsee-pdf-reader>=0.1.8.2,<0.2",
    "lxml>=4.9.1,<5",
    "opencv-python>=4.9.0.80,<5",
    "torch>=2,<2.3",
    "urllib3>=1.26,<2",
    "sentence-transformers>=2.7,<3",
    "transformers>=4.47.1,<4.50",
    "scikit-learn>=1.5.2,<2",
    "anthropic>=0.40.0,<1",
    "ollama>=0.1.8,<1",
    "together>=1.1.1,<2",
    "openai>=2.13.0,<3",
    "cohere>=5.3.3,<6",
    "mistralai>=1.1.0,<2",
    "replicate>=0.23.1,<1",
    "tenacity>=8.1.0,<9",
    "pydantic-settings>=2.6.1,<3",
    "google-genai>=1.26.0,<2",
]

[project.urls]
Homepage = "https://parsee.ai"

[project.optional-dependencies]
langchain = [
    "langchain>=0.1.11,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9",
    "pytest-env>=1.1.5,<2",
    "pytest-dotenv>=0.5.2,<0.6",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsee"]

[tool.pytest.ini_options]
log_cli = "True"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
env_files = [".env"]
env = [
    "max_cache_size=1",
    "retry_attempts=2",
]
